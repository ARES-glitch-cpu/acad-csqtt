name: Build Windows portable

on:
  push:
    branches: ["feature/**", "ui-v1.4.1-dns-auto-config"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-go@v7
        with:
          go-version-file: packet-proxy/go.mod
          cache-dependency-path: packet-proxy/go.sum
      - name: Set up Rust
        run: rustup show
      - name: Test Windows packet helper
        run: |
          Push-Location packet-proxy
          try { go test ./... } finally { Pop-Location }
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Build portable application and smoke test
        run: ./build.ps1
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CSQTT-Windows-x64
          path: CSQTT-v*-Win10-x64.zip
          if-no-files-found: error
          retention-days: 14
