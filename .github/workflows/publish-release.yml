name: Publish existing builds to GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing GitHub Release tag"
        required: true
        default: "errrrrrr"
        type: string
      windows_run_id:
        description: "Successful Windows build workflow run ID"
        required: true
        default: "44308996460"
        type: string
      linux_run_id:
        description: "Successful Linux build workflow run ID"
        required: true
        default: "44308996487"
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Attach Windows and Linux builds
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.windows_run_id }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name CSQTT-Windows-x64 --dir dist/windows

      - name: Download Linux build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.linux_run_id }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name CSQTT-Linux-x86_64 --dir dist/linux

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          windows_file="$(find dist/windows -type f -name 'CSQTT-v*-Win10-x64.zip' -print -quit)"
          linux_file="$(find dist/linux -type f -name 'CSQTT-v*-Linux-x86_64.tar.gz' -print -quit)"
          linux_sha="$(find dist/linux -type f -name 'CSQTT-v*-Linux-x86_64.tar.gz.sha256' -print -quit)"

          test -n "$windows_file" || { echo "Windows ZIP not found in artifact"; exit 1; }
          test -n "$linux_file" || { echo "Linux archive not found in artifact"; exit 1; }

          cp "$windows_file" release-assets/
          cp "$linux_file" release-assets/
          if [ -n "$linux_sha" ]; then cp "$linux_sha" release-assets/; fi

          echo "Assets prepared:"
          ls -lh release-assets

      - name: Upload files to existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
