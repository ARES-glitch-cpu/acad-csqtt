name: Update Android + Rostele release

on:
  # Run from the default branch so GITHUB_TOKEN has this repository's write permissions.
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-android-rostele.yml"
  workflow_dispatch:
    inputs:
      android_run_id:
        description: "Successful multi-ABI Android build workflow run ID"
        required: true
        default: "45843447408"
        type: string
      tag_name:
        description: "Existing Android + Rostele release tag"
        required: true
        default: "android-rostele-2.5.3-test.1"
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Update Android APK assets
    runs-on: ubuntu-latest
    steps:
      - name: Download successful multi-ABI Android build
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RUN_ID: ${{ inputs.android_run_id || '45843447408' }}
        run: |
          set -euo pipefail
          gh run download "$ANDROID_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name csqttr-2.5.3-getworkers-fix-debug --dir android-artifacts

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          for apk in app-universal-debug.apk app-arm64-v8a-debug.apk app-armeabi-v7a-debug.apk app-x86_64-debug.apk; do
            source_file="$(find android-artifacts -type f -name "$apk" -print -quit)"
            test -n "$source_file" || { echo "Required APK not found: $apk"; exit 1; }
            cp "$source_file" release-assets/
          done

          unzip -l release-assets/app-universal-debug.apk > universal-contents.txt
          grep -q 'lib/arm64-v8a/libclient.so' universal-contents.txt
          grep -q 'lib/armeabi-v7a/libclient.so' universal-contents.txt
          grep -q 'lib/x86_64/libclient.so' universal-contents.txt

          (
            cd release-assets
            sha256sum *.apk > SHA256SUMS.txt
          )

          cat > release-notes.md <<'EOF'
          Тестовая Android-сборка CSQTTR 2.5.3 с исправлением согласования количества workers через GETWORKERS.

          **Универсальный APK поддерживает три архитектуры:**
          - ARM64 (arm64-v8a) — современные Android-телефоны;
          - ARMv7 (armeabi-v7a) — 32-битные ARM-устройства;
          - x86_64 — BlueStacks и Android-эмуляторы на x86_64.

          Вложения включают универсальный APK, отдельные APK для ARM64, ARMv7 и x86_64, а также SHA256SUMS.txt.

          **Важно:** это debug-сборка для тестирования, подписанная тестовым ключом, а не production-релиз. Она устанавливается отдельно от обычного приложения благодаря суффиксу идентификатора пакета .getworkersfix. Изменения на сервере не требуются.
          EOF

          ls -lh release-assets

      - name: Verify target release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || 'android-rostele-2.5.3-test.1' }}
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY"

      - name: Upload and replace Android assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || 'android-rostele-2.5.3-test.1' }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            release-assets/* --clobber
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Android + Rostele" --notes-file release-notes.md --prerelease
