name: Build Linux portable

on:
  push:
    branches: ["feature/**", "ui-v1.4.1-dns-auto-config"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev libffi-dev \
            python3-tk tk-dev tcl-dev xvfb libx11-6 libxext6 libxrender1 libxinerama1 \
            libxkbcommon0 libglib2.0-0 libdbus-1-3 libasound2t64 iproute2 systemd-resolved pkexec
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-go@v7
        with:
          go-version-file: packet-proxy/go.mod
          cache-dependency-path: packet-proxy/go.sum
      - name: Set up Rust
        run: rustup show
      - name: Install Python build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Test Python application and Go helper
        run: |
          python -m unittest discover -s tests -v
          cd packet-proxy
          go test ./...
      - name: Build Linux portable application
        run: bash scripts/build-linux.sh
      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: CSQTT-Linux-x86_64
          path: |
            CSQTT-v*-Linux-x86_64.tar.gz
            CSQTT-v*-Linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
