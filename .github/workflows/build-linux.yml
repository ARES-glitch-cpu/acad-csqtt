name: Build Linux portable

on:
  pull_request:
    branches: [main]
  push:
    branches: ["main", "gui-v1.4.1-admin-client-dns", "feature/**", "ui-v1.4.1-dns-auto-config"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Wails and Linux TUN dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang libclang-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth \
            iproute2 policykit-1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            packet-proxy/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        run: rustup show

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/rust-client/target
          key: linux-rust-${{ hashFiles('rust-toolchain.toml', 'core/rust-client/Cargo.lock', 'core/rust-client/Cargo.toml', 'core/rust-client/vendor/**') }}-${{ github.sha }}
          restore-keys: |
            linux-rust-${{ hashFiles('rust-toolchain.toml', 'core/rust-client/Cargo.lock', 'core/rust-client/Cargo.toml', 'core/rust-client/vendor/**') }}-

      - name: Build Linux portable application and smoke test
        run: bash scripts/build-linux.sh

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: CSQTT-Linux-x86_64
          path: |
            CSQTT-v*-Linux-x86_64.tar.gz
            CSQTT-v*-Linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
